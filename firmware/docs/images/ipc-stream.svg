<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
  <style>
    .b   { font-size: 13px; font-weight: 600; }
    .s   { font-size: 11.5px; fill: #6b7280; }
    .m   { font-size: 11.5px; font-family: ui-monospace, Menlo, Consolas, monospace; fill: #4b5563; }
    .ttl { font-size: 15px; font-weight: 700; fill: #374151; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="600" fill="#fbfbfd"/>

  <text x="20" y="28" class="ttl">코어 간 패킷 통신 — 버퍼에 쓰고, 이벤트로 알린다</text>
  <text x="20" y="48" class="s">cmd 패킷(STX 02 FD) → cmd_driver_t → ipc 스트림(링 버퍼) → MU GP0 doorbell · 실측 512 B 왕복 537 µs</text>
  <rect x="20" y="66" width="260" height="34" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="150.0" y="86" class="b" text-anchor="middle" fill="#3730a3">CM33 (240 MHz)</text>
  <rect x="350" y="66" width="260" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="480.0" y="86" class="b" text-anchor="middle" fill="#15803d">OCRAM2 공유 블록 (non-cacheable)</text>
  <rect x="680" y="66" width="260" height="34" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="810.0" y="86" class="b" text-anchor="middle" fill="#c2410c">CM7 (792 MHz)</text>
  <rect x="20" y="120" width="260" height="56" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="150.0" y="140" class="b" text-anchor="middle" fill="#3730a3">ap · modules/cmd/process/cmd_peer.c</text>
  <text x="150.0" y="158" class="s" text-anchor="middle">CLI peer info / peer echo</text>
  <rect x="680" y="120" width="260" height="56" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.4"/>
  <text x="810.0" y="140" class="b" text-anchor="middle" fill="#c2410c">ap · modules/cmd/process/cmd_peer.c</text>
  <text x="810.0" y="158" class="s" text-anchor="middle">cmdPeerProcess: PEER_INFO · ECHO</text>
  <line x1="150" y1="176" x2="150" y2="192" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="810" y1="176" x2="810" y2="192" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="20" y="192" width="260" height="56" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="150.0" y="212" class="b" text-anchor="middle" fill="#3730a3">common/hw/src/cmd.c</text>
  <text x="150.0" y="230" class="s" text-anchor="middle">패킷 조립 · 파서 · 체크섬</text>
  <rect x="680" y="192" width="260" height="56" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.4"/>
  <text x="810.0" y="212" class="b" text-anchor="middle" fill="#c2410c">common/hw/src/cmd.c</text>
  <text x="810.0" y="230" class="s" text-anchor="middle">두 코어가 같은 파일</text>
  <line x1="150" y1="248" x2="150" y2="264" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="810" y1="248" x2="810" y2="264" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="20" y="264" width="260" height="56" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="150.0" y="284" class="b" text-anchor="middle" fill="#3730a3">ap · modules/cmd/driver/drv_ipc.c</text>
  <text x="150.0" y="302" class="s" text-anchor="middle">cmd_driver_t · 64 B 수신 덩어리</text>
  <rect x="680" y="264" width="260" height="56" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.4"/>
  <text x="810.0" y="284" class="b" text-anchor="middle" fill="#c2410c">ap · modules/cmd/driver/drv_ipc.c</text>
  <text x="810.0" y="302" class="s" text-anchor="middle">같은 구조</text>
  <line x1="150" y1="320" x2="150" y2="336" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="810" y1="320" x2="810" y2="336" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="20" y="336" width="260" height="56" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="150.0" y="356" class="b" text-anchor="middle" fill="#3730a3">hw · ipc.c 스트림</text>
  <text x="150.0" y="374" class="s" text-anchor="middle">ipcStreamWrite / Read</text>
  <rect x="680" y="336" width="260" height="56" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.4"/>
  <text x="810.0" y="356" class="b" text-anchor="middle" fill="#c2410c">hw · ipc.c 스트림</text>
  <text x="810.0" y="374" class="s" text-anchor="middle">ipcStreamWrite / Read</text>
  <rect x="350" y="120" width="260" height="62" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <text x="480.0" y="140" class="b" text-anchor="middle" fill="#15803d">shared_t 헤더 (68 B)</text>
  <text x="480.0" y="158" class="m" text-anchor="middle">magic · version · alive</text>
  <text x="480.0" y="174" class="s" text-anchor="middle">상태 — 언제 읽어도 되는 값</text>
  <rect x="350" y="196" width="260" height="72" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="480.0" y="216" class="b" text-anchor="middle" fill="#15803d">m2p 링 1 KB</text>
  <text x="480.0" y="234" class="m" text-anchor="middle">head(CM33 만) · tail(CM7 만)</text>
  <text x="480.0" y="250" class="s" text-anchor="middle">CM33 → CM7</text>
  <rect x="350" y="282" width="260" height="72" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="480.0" y="302" class="b" text-anchor="middle" fill="#15803d">p2m 링 1 KB</text>
  <text x="480.0" y="320" class="m" text-anchor="middle">head(CM7 만) · tail(CM33 만)</text>
  <text x="480.0" y="336" class="s" text-anchor="middle">CM7 → CM33</text>
  <line x1="282" y1="360" x2="348" y2="232" stroke="#16a34a" stroke-width="1.6" marker-end="url(#g)"/>
  <text x="312" y="310" class="s" text-anchor="middle" fill="#15803d">① 쓰기</text>
  <line x1="612" y1="232" x2="678" y2="360" stroke="#16a34a" stroke-width="1.6" marker-end="url(#g)"/>
  <text x="652" y="310" class="s" text-anchor="middle" fill="#15803d">④ 읽기</text>
  <line x1="678" y1="380" x2="612" y2="318" stroke="#16a34a" stroke-width="1.2" marker-end="url(#g)"/>
  <line x1="348" y1="318" x2="282" y2="380" stroke="#16a34a" stroke-width="1.2" marker-end="url(#g)"/>
  <rect x="350" y="410" width="260" height="74" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="480.0" y="430" class="b" text-anchor="middle" fill="#b45309">MU1 (A ↔ B)</text>
  <text x="480.0" y="448" class="m" text-anchor="middle">GP0 : doorbell (데이터 없음)</text>
  <text x="480.0" y="464" class="m" text-anchor="middle">TR0/TR1 : 짧은 메시지 · ping</text>
  <line x1="150" y1="402" x2="348" y2="440" stroke="#d97706" stroke-width="1.6" marker-end="url(#r)"/>
  <text x="240" y="410" class="s" text-anchor="middle" fill="#b45309">② __DMB → head → GP0</text>
  <line x1="612" y1="440" x2="808" y2="402" stroke="#d97706" stroke-width="1.6" marker-end="url(#r)"/>
  <text x="720" y="410" class="s" text-anchor="middle" fill="#b45309">③ IRQ (WFI 에서도 깸)</text>
  <text x="30" y="520" class="s" text-anchor="start">쓰는 쪽은 head 만, 읽는 쪽은 tail 만 고친다 (단일 생산자 / 소비자, 락 없음).</text>
  <text x="30" y="538" class="s" text-anchor="start">GP0 는 여러 번 울려도 하나로 합쳐진다 → 받는 쪽은 빌 때까지 다 읽는다. 놓치는 것이 없다.</text>
  <text x="30" y="556" class="s" text-anchor="start">두 링은 CM33 이 CM7 을 깨우기 전에 비운다. 구조가 바뀌면 SHARED_VERSION 을 올린다 (지금 2).</text>
  <text x="30" y="574" class="s" text-anchor="start">CM7 은 WFI 에서 코어 클럭이 꺼진다 — IRQ(MU)로 깨지만 SysTick 은 멈춘다. 지금은 깨어 있는 루프다.</text>
</svg>
