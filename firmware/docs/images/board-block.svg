<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
  <style>
    .b   { font-size: 13px; font-weight: 600; }
    .s   { font-size: 11.5px; fill: #6b7280; }
    .m   { font-size: 11.5px; font-family: ui-monospace, Menlo, Consolas, monospace; fill: #4b5563; }
    .ttl { font-size: 15px; font-weight: 700; fill: #374151; }
  </style>
  <rect x="0" y="0" width="960" height="620" fill="#fbfbfd"/>

  <text x="20" y="28" class="ttl">FRDM-IMXRT1186 블록도 — 브링업에 쓰는 자원</text>
  <text x="20" y="48" class="s">회로도 SCH-95302 Rev C · UM12450 · 굵은 테두리는 1~2차 목표에서 쓰는 것</text>

  <!-- MCU -->
  <rect x="340" y="200" width="280" height="200" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="480" y="228" class="b" text-anchor="middle" fill="#3730a3">MIMXRT1186</text>
  <text x="480" y="248" class="s" text-anchor="middle">LFBGA196</text>
  <rect x="360" y="262" width="115" height="54" rx="6" fill="#ffffff" stroke="#6366f1"/>
  <text x="417" y="285" class="b" text-anchor="middle" fill="#3730a3">CM33</text>
  <text x="417" y="303" class="s" text-anchor="middle">부트 코어</text>
  <rect x="485" y="262" width="115" height="54" rx="6" fill="#ffffff" stroke="#ea580c"/>
  <text x="542" y="285" class="b" text-anchor="middle" fill="#c2410c">CM7</text>
  <text x="542" y="303" class="s" text-anchor="middle">800 MHz</text>
  <rect x="360" y="328" width="240" height="56" rx="6" fill="#ffffff" stroke="#a78bfa"/>
  <text x="480" y="350" class="b" text-anchor="middle" fill="#5b21b6">ELE · NETC · ECAT</text>
  <text x="480" y="370" class="s" text-anchor="middle">보안 · TSN 스위치 · EtherCAT</text>

  <!-- 왼쪽: 메모리 -->
  <rect x="30" y="90" width="250" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="155" y="114" class="b" text-anchor="middle" fill="#1e40af">QSPI NOR 16 MB (U28)</text>
  <text x="155" y="134" class="m" text-anchor="middle">FlexSPI2 · GPIO_AON_22~27</text>
  <line x1="280" y1="120" x2="380" y2="200" stroke="#2563eb" stroke-width="2"/>

  <rect x="30" y="170" width="250" height="50" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="155" y="192" class="b" text-anchor="middle" fill="#b45309">HyperRAM 8 MB (U18)</text>
  <text x="155" y="210" class="m" text-anchor="middle">FlexSPI1</text>
  <line x1="280" y1="195" x2="340" y2="240" stroke="#d97706"/>

  <rect x="30" y="240" width="250" height="50" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="5 3"/>
  <text x="155" y="262" class="b" text-anchor="middle" fill="#6b7280">HyperFlash 64 MB (U24)</text>
  <text x="155" y="280" class="s" text-anchor="middle">기본 미연결</text>

  <!-- 왼쪽 아래: 사용자 IO -->
  <rect x="30" y="330" width="250" height="78" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="155" y="352" class="b" text-anchor="middle" fill="#15803d">RGB LED D4</text>
  <text x="155" y="372" class="m" text-anchor="middle">R EMC_B1_09 · G EMC_B1_11</text>
  <text x="155" y="390" class="m" text-anchor="middle">B EMC_B1_39 · High=ON</text>
  <line x1="280" y1="368" x2="340" y2="340" stroke="#16a34a" stroke-width="2"/>

  <rect x="30" y="428" width="250" height="50" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="155" y="450" class="b" text-anchor="middle">SW4 사용자 버튼</text>
  <text x="155" y="468" class="m" text-anchor="middle">GPIO_AD_12 (J30)</text>
  <line x1="280" y1="452" x2="340" y2="380" stroke="#9ca3af"/>

  <rect x="30" y="498" width="250" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="155" y="520" class="b" text-anchor="middle" fill="#b45309">J60 BOOT_MODE DIP</text>
  <text x="155" y="540" class="m" text-anchor="middle">GPIO_AON_00~02</text>
  <line x1="280" y1="528" x2="400" y2="400" stroke="#d97706" stroke-width="2"/>

  <!-- 오른쪽: 디버거 -->
  <rect x="680" y="90" width="250" height="110" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="805" y="114" class="b" text-anchor="middle" fill="#9d174d">MCU-Link OB (LPC55S69)</text>
  <text x="805" y="134" class="s" text-anchor="middle">CMSIS-DAP · USB-C J23</text>
  <text x="805" y="156" class="m" text-anchor="middle">SWD · VCOM1=LPUART1</text>
  <text x="805" y="176" class="m" text-anchor="middle">VCOM2=LPUART3 · 5V 전원</text>
  <line x1="680" y1="150" x2="590" y2="200" stroke="#db2777" stroke-width="2"/>

  <rect x="680" y="220" width="250" height="50" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="805" y="242" class="b" text-anchor="middle">J62 SWD (외부 디버거)</text>
  <text x="805" y="260" class="s" text-anchor="middle">J36 단락 후 사용</text>

  <!-- 오른쪽: 네트워크 -->
  <rect x="680" y="300" width="250" height="110" rx="6" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="805" y="322" class="b" text-anchor="middle" fill="#5b21b6">네트워크 RJ45 4개</text>
  <text x="805" y="344" class="s" text-anchor="middle">J57A/B EtherCAT RTL8201 (기본)</text>
  <text x="805" y="364" class="s" text-anchor="middle">J56A/B ETH0/2 YT8531 1G</text>
  <text x="805" y="386" class="s" text-anchor="middle">TMUX136 로 핀 공유</text>
  <line x1="680" y1="355" x2="620" y2="355" stroke="#7c3aed"/>

  <rect x="680" y="430" width="250" height="50" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="805" y="452" class="b" text-anchor="middle">USB OTG1 (J63) · CAN</text>
  <text x="805" y="470" class="s" text-anchor="middle">로드맵 30 대역</text>
  <line x1="680" y1="455" x2="600" y2="400" stroke="#9ca3af"/>

  <rect x="680" y="498" width="250" height="60" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="805" y="520" class="b" text-anchor="middle">Arduino · 모터 커넥터</text>
  <text x="805" y="540" class="s" text-anchor="middle">J1 · J2 · J3 · J51~53</text>
  <line x1="680" y1="528" x2="560" y2="400" stroke="#9ca3af"/>

  <!-- 크리스탈 -->
  <rect x="380" y="450" width="200" height="50" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="480" y="472" class="b" text-anchor="middle">Y2 24 MHz · Y1 32.768 kHz</text>
  <text x="480" y="490" class="s" text-anchor="middle">PHY 용 25 MHz 4개 별도</text>
  <line x1="480" y1="450" x2="480" y2="400" stroke="#9ca3af"/>
</svg>
