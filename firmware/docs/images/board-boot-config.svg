<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
  <style>
    .b   { font-size: 13px; font-weight: 600; }
    .s   { font-size: 11.5px; fill: #6b7280; }
    .m   { font-size: 11.5px; font-family: ui-monospace, Menlo, Consolas, monospace; fill: #4b5563; }
    .ttl { font-size: 15px; font-weight: 700; fill: #374151; }
  </style>
  <rect x="0" y="0" width="900" height="400" fill="#fbfbfd"/>

  <text x="20" y="28" class="ttl">부트 설정 — J60 DIP 스위치와 리셋 경로</text>
  <text x="20" y="48" class="s">BOOT_MODE[2:0] = J60[3:1] · ON = 1 · POR 때만 샘플</text>

  <!-- DIP: 3 cases -->
  <text x="40" y="84" class="b" fill="#15803d">평소 · QSPI 부팅</text>
  <rect x="40" y="96" width="180" height="90" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="58" y="110" width="40" height="60" rx="3" fill="#e5e7eb"/><rect x="62" y="114" width="32" height="24" rx="2" fill="#16a34a"/>
  <rect x="110" y="110" width="40" height="60" rx="3" fill="#e5e7eb"/><rect x="114" y="142" width="32" height="24" rx="2" fill="#9ca3af"/>
  <rect x="162" y="110" width="40" height="60" rx="3" fill="#e5e7eb"/><rect x="166" y="142" width="32" height="24" rx="2" fill="#9ca3af"/>
  <text x="78" y="182" class="m" text-anchor="middle">3</text><text x="130" y="182" class="m" text-anchor="middle">2</text><text x="182" y="182" class="m" text-anchor="middle">1</text>
  <text x="130" y="210" class="m" text-anchor="middle">100 · FlexSPI NOR</text>

  <text x="270" y="84" class="b" fill="#b45309">디버거로 RAM 실행</text>
  <rect x="270" y="96" width="180" height="90" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <rect x="288" y="110" width="40" height="60" rx="3" fill="#e5e7eb"/><rect x="292" y="114" width="32" height="24" rx="2" fill="#d97706"/>
  <rect x="340" y="110" width="40" height="60" rx="3" fill="#e5e7eb"/><rect x="344" y="114" width="32" height="24" rx="2" fill="#d97706"/>
  <rect x="392" y="110" width="40" height="60" rx="3" fill="#e5e7eb"/><rect x="396" y="142" width="32" height="24" rx="2" fill="#9ca3af"/>
  <text x="308" y="182" class="m" text-anchor="middle">3</text><text x="360" y="182" class="m" text-anchor="middle">2</text><text x="412" y="182" class="m" text-anchor="middle">1</text>
  <text x="360" y="210" class="m" text-anchor="middle">110 · Infinite Loop</text>

  <text x="500" y="84" class="b" fill="#b91c1c">복구</text>
  <rect x="500" y="96" width="180" height="90" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <rect x="518" y="110" width="40" height="60" rx="3" fill="#e5e7eb"/><rect x="522" y="142" width="32" height="24" rx="2" fill="#9ca3af"/>
  <rect x="570" y="110" width="40" height="60" rx="3" fill="#e5e7eb"/><rect x="574" y="142" width="32" height="24" rx="2" fill="#9ca3af"/>
  <rect x="622" y="110" width="40" height="60" rx="3" fill="#e5e7eb"/><rect x="626" y="114" width="32" height="24" rx="2" fill="#dc2626"/>
  <text x="538" y="182" class="m" text-anchor="middle">3</text><text x="590" y="182" class="m" text-anchor="middle">2</text><text x="642" y="182" class="m" text-anchor="middle">1</text>
  <text x="590" y="210" class="m" text-anchor="middle">001 · 시리얼 다운로더</text>

  <rect x="720" y="96" width="160" height="90" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="736" y="120" class="s">위 = ON (1)</text>
  <text x="736" y="142" class="s">아래 = OFF (0)</text>
  <text x="736" y="164" class="s">숫자 = J60 핀</text>

  <!-- 리셋 경로 -->
  <text x="40" y="256" class="b" fill="#374151">POR 을 거는 경로 (BOOT_MODE 다시 샘플)</text>
  <rect x="40" y="272" width="180" height="46" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="130" y="292" class="b" text-anchor="middle">SW2 리셋 버튼</text>
  <text x="130" y="309" class="s" text-anchor="middle">J24 단락 (기본)</text>

  <rect x="40" y="330" width="180" height="46" rx="6" fill="#ffffff" stroke="#9ca3af"/>
  <text x="130" y="350" class="b" text-anchor="middle">MCU-Link 리셋</text>
  <text x="130" y="367" class="s" text-anchor="middle">J26 단락 (기본)</text>


  <line x1="220" y1="295" x2="330" y2="320" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="220" y1="353" x2="330" y2="330" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="330" y="302" width="150" height="46" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="405" y="330" class="b" text-anchor="middle" fill="#3730a3">MCU POR</text>
  <line x1="480" y1="325" x2="540" y2="325" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="540" y="302" width="200" height="46" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="640" y="322" class="b" text-anchor="middle" fill="#15803d">BOOT_MODE 샘플</text>
  <text x="640" y="339" class="m" text-anchor="middle">→ SBMR2 → ROM</text>
</svg>
