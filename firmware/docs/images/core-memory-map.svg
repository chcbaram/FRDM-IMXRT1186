  <rect x="630" y="780" width="22" height="14" rx="3" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="660" y="792" class="s">미할당 · 안 씀 · ROM</text>
  <text x="30" y="826" class="s">노란 테두리 행: 같은 주소가 두 코어에서 서로 다른 메모리다. 상대 코어 TCM 은 alias 로만 보인다. 공유 데이터는 두 코어가 같은 주소로 보는 OCRAM2 에 둔다.</text>
