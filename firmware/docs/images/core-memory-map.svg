  <rect x="540" y="551" width="400" height="36" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="552" y="567" class="b" fill="#15803d">OCRAM2 · 4 KB</text>
  <text x="552" y="582" class="s">공유 블록 .shared ②</text>
