  <rect x="0" y="0" width="960" height="854" fill="#fbfbfd"/>

  <text x="20" y="28" class="ttl">코어별 메모리 할당 맵 — 로드맵 25 기준</text>
  <text x="20" y="48" class="s">주소는 한 축 · 같은 행 = 같은 주소 · 색 = 소유 · ① CM7 이미지 경로 · ② 공유 블록 · 빈 칸 = 그 코어에서 매핑 없음</text>

  <text x="24" y="114" class="b" fill="#374151">주소</text>
  <rect x="128" y="66" width="400" height="34" rx="6" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="328" y="88" class="b" text-anchor="middle" fill="#3730a3">CM33 (240 MHz)</text>
  <rect x="540" y="66" width="400" height="34" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text x="740" y="88" class="b" text-anchor="middle" fill="#c2410c">CM7 (792 MHz)</text>
