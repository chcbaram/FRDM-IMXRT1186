<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
  <style>
    .b   { font-size: 13px; font-weight: 600; }
    .s   { font-size: 11.5px; fill: #6b7280; }
    .m   { font-size: 11.5px; font-family: ui-monospace, Menlo, Consolas, monospace; fill: #4b5563; }
    .ttl { font-size: 15px; font-weight: 700; fill: #374151; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="600" fill="#fbfbfd"/>

  <text x="20" y="28" class="ttl">CM7 원격 CLI (TODO) — SSH 처럼 CM33 이 중계한다</text>
  <text x="20" y="48" class="s">PC 터미널 ↔ CM33 peer term (중계) ↔ 코어 간 통로 ↔ CM7 가상 UART ↔ CM7 cli · 통로는 세 안 중 구현 때 고른다</text>
  <rect x="20" y="66" width="150" height="74" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
  <text x="95.0" y="86" class="b" text-anchor="middle" fill="#374151">PC 터미널</text>
  <text x="95.0" y="104" class="s" text-anchor="middle">baram-term</text>
  <text x="95.0" y="120" class="s" text-anchor="middle">키 입력 · 화면</text>
  <rect x="220" y="66" width="210" height="74" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="325.0" y="86" class="b" text-anchor="middle" fill="#3730a3">CM33 peer term</text>
  <text x="325.0" y="104" class="s" text-anchor="middle">바이트를 그대로 넘긴다</text>
  <text x="325.0" y="120" class="s" text-anchor="middle">탈출 키 Ctrl-] · ~.</text>
  <rect x="480" y="66" width="200" height="74" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="580.0" y="86" class="b" text-anchor="middle" fill="#b45309">코어 간 통로</text>
  <text x="580.0" y="104" class="s" text-anchor="middle">A · B · C 중 하나</text>
  <text x="580.0" y="120" class="s" text-anchor="middle">(아래)</text>
  <rect x="730" y="66" width="210" height="74" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.4"/>
  <text x="835.0" y="86" class="b" text-anchor="middle" fill="#c2410c">CM7 가상 UART → cli</text>
  <text x="835.0" y="104" class="s" text-anchor="middle">uart_driver_t 훅 채널</text>
  <text x="835.0" y="120" class="m" text-anchor="middle">cm7# 프롬프트</text>
  <line x1="172" y1="103" x2="218" y2="103" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="218" y1="103" x2="172" y2="103" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="432" y1="103" x2="478" y2="103" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="478" y1="103" x2="432" y2="103" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="682" y1="103" x2="728" y2="103" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="728" y1="103" x2="682" y2="103" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="195" y="96" class="s" text-anchor="middle">UART</text>
  <rect x="20" y="180" width="300" height="150" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="170.0" y="200" class="b" text-anchor="middle" fill="#3730a3">A. cmd 채널에 패킷으로</text>
  <text x="170.0" y="218" class="m" text-anchor="middle">링 m2p/p2m (지금 것)</text>
  <text x="170.0" y="234" class="m" text-anchor="middle">+ SHARED_CMD_TERM_DATA</text>
  <text x="170.0" y="250" class="s" text-anchor="middle">새 링 · doorbell 없음</text>
  <text x="170.0" y="266" class="s" text-anchor="middle">cmd 와 한 줄로 선다</text>
  <text x="170.0" y="282" class="s" text-anchor="middle">(큰 cmd 가 터미널을 막는다)</text>
  <text x="170.0" y="298" class="s" text-anchor="middle">CM33 cmd 잠금과 얽힌다</text>
  <rect x="330" y="180" width="300" height="150" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.4"/>
  <text x="480.0" y="200" class="b" text-anchor="middle" fill="#15803d">B. 별도 바이트 스트림</text>
  <text x="480.0" y="218" class="m" text-anchor="middle">전용 링 한 쌍 + GP1</text>
  <text x="480.0" y="234" class="m" text-anchor="middle">제어: MU 메시지 OPEN/CLOSE</text>
  <text x="480.0" y="250" class="s" text-anchor="middle">UART 와 1:1 (가상 시리얼)</text>
  <text x="480.0" y="266" class="s" text-anchor="middle">가장 단순 · 틀 없음</text>
  <text x="480.0" y="282" class="s" text-anchor="middle">공유 블록 +1 KB 이상</text>
  <text x="480.0" y="298" class="s" text-anchor="middle">세션 하나</text>
  <rect x="640" y="180" width="300" height="150" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
  <text x="790.0" y="200" class="b" text-anchor="middle" fill="#c2410c">C. CLI 전용 패킷 채널</text>
  <text x="790.0" y="218" class="m" text-anchor="middle">전용 링 한 쌍 + GP1</text>
  <text x="790.0" y="234" class="m" text-anchor="middle">cmd 틀(02 FD …) 재사용</text>
  <text x="790.0" y="250" class="s" text-anchor="middle">데이터 · 제어를 같은 틀로</text>
  <text x="790.0" y="266" class="s" text-anchor="middle">cmd 와 격리</text>
  <text x="790.0" y="282" class="s" text-anchor="middle">공유 블록 +1 KB 이상</text>
  <text x="790.0" y="298" class="s" text-anchor="middle">세션 · 창 크기 등 확장 쉬움</text>
  <rect x="20" y="350" width="920" height="120" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.4"/>
  <text x="480.0" y="370" class="b" text-anchor="middle" fill="#374151">공유 블록 (OCRAM2, non-cacheable) 예산</text>
  <text x="480.0" y="388" class="m" text-anchor="middle">지금 shared_t 2132 B / 4 KB  =  헤더 68 B + m2p 1 KB + p2m 1 KB</text>
  <text x="480.0" y="404" class="m" text-anchor="middle">B · C 에 링 512 B × 2 를 더하면  ≈ 3180 B  → 4 KB 안</text>
  <text x="480.0" y="420" class="m" text-anchor="middle">링 1 KB × 2 를 더하면          ≈ 4196 B  → 8 KB 로 늘리고 CM7 MPU 7 번 · 링커 SHARED 를 고친다</text>
  <text x="480.0" y="436" class="s" text-anchor="middle">doorbell 은 GP0 (cmd 스트림) 을 쓰고 있다. GP1~3 이 비어 있다</text>
  <text x="24" y="500" class="s" text-anchor="start">CM7 쪽은 cli.c 를 그대로 쓴다. cli 는 uartRead / uartWrite(ch) 로만 입출력한다 → 훅 채널이면 자기가 IPC 위에 있는 줄 모른다.</text>
  <text x="24" y="520" class="s" text-anchor="start">에코 · 줄 편집 · 히스토리는 CM7 cli 가 한다. CM33 은 화살표 키 같은 ESC 시퀀스까지 날 바이트로 넘긴다.</text>
  <text x="24" y="540" class="s" text-anchor="start">같은 가상 UART 구조로 나중에 USB CDC · 텔넷(네트워크) 세션도 CM7 cli 에 붙인다.</text>
</svg>
