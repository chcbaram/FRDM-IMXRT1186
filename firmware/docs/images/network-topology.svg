<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
  <style>
    .b   { font-size: 13px; font-weight: 600; }
    .s   { font-size: 11.5px; fill: #6b7280; }
    .m   { font-size: 11.5px; font-family: ui-monospace, Menlo, Consolas, monospace; fill: #4b5563; }
    .ttl { font-size: 15px; font-weight: 700; fill: #374151; }
  </style>
  <rect x="0" y="0" width="960" height="560" fill="#fbfbfd"/>

  <text x="20" y="28" class="ttl">네트워크 구성 — NETC 스위치 · EtherCAT · PHY 4개</text>
  <text x="20" y="48" class="s">RM 53, 55장 · UM12450 2.4, 2.5 · 굵은 선은 출하 기본 점퍼 상태</text>

  <!-- MCU -->
  <rect x="20" y="70" width="400" height="460" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="36" y="94" class="b" fill="#3730a3">MIMXRT1186</text>

  <!-- NETC -->
  <rect x="40" y="108" width="360" height="220" rx="8" fill="#ffffff" stroke="#db2777" stroke-width="1.5"/>
  <text x="56" y="130" class="b" fill="#9d174d">NETC  0x6000_0000</text>
  <rect x="60" y="144" width="150" height="56" rx="5" fill="#fce7f3" stroke="#db2777"/>
  <text x="135" y="168" class="b" text-anchor="middle" fill="#9d174d">ENETC</text>
  <text x="135" y="186" class="s" text-anchor="middle">호스트 NIC · DMA 링</text>
  <rect x="230" y="144" width="150" height="56" rx="5" fill="#fce7f3" stroke="#db2777"/>
  <text x="305" y="168" class="b" text-anchor="middle" fill="#9d174d">Timer · EMDIO</text>
  <text x="305" y="186" class="s" text-anchor="middle">1588 · PHY 관리</text>
  <line x1="135" y1="200" x2="135" y2="226" stroke="#db2777" stroke-width="1.5"/>
  <text x="145" y="218" class="s">Pseudo MAC</text>
  <rect x="60" y="228" width="320" height="84" rx="5" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
  <text x="150" y="266" class="b" text-anchor="middle" fill="#9d174d">TSN Switch</text>
  <text x="150" y="284" class="s" text-anchor="middle">802.1Q · 8 TC</text>
  <rect x="250" y="236" width="120" height="30" rx="4" fill="#ffffff" stroke="#db2777"/>
  <text x="310" y="256" class="m" text-anchor="middle">ETH0 포트</text>
  <rect x="250" y="274" width="120" height="30" rx="4" fill="#ffffff" stroke="#db2777"/>
  <text x="310" y="294" class="m" text-anchor="middle">ETH2 포트</text>

  <!-- ECAT -->
  <rect x="40" y="344" width="360" height="170" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="56" y="366" class="b" fill="#0e7490">eCAT (ESC)</text>
  <rect x="60" y="380" width="320" height="56" rx="5" fill="#ecfeff" stroke="#0891b2"/>
  <text x="220" y="403" class="b" text-anchor="middle" fill="#0e7490">FMMU · SyncManager · DC</text>
  <text x="220" y="421" class="s" text-anchor="middle">PDI 로 CPU 와 연결 · SII EEPROM</text>
  <rect x="250" y="446" width="120" height="28" rx="4" fill="#ffffff" stroke="#0891b2"/>
  <text x="310" y="465" class="m" text-anchor="middle">ECAT0</text>
  <rect x="250" y="480" width="120" height="28" rx="4" fill="#ffffff" stroke="#0891b2"/>
  <text x="310" y="499" class="m" text-anchor="middle">ECAT1</text>

  <!-- 같은 핀 묶음 표시 -->
  <rect x="440" y="150" width="130" height="150" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text x="505" y="176" class="b" text-anchor="middle" fill="#c2410c">MUX A</text>
  <text x="505" y="196" class="s" text-anchor="middle">TMUX136 x6</text>
  <text x="505" y="218" class="m" text-anchor="middle">SEL J12</text>
  <text x="505" y="238" class="m" text-anchor="middle">OE  J13</text>
  <text x="505" y="262" class="s" text-anchor="middle">ECAT0 ↔ ETH0</text>
  <text x="505" y="282" class="s" text-anchor="middle">핀 공유</text>

  <rect x="440" y="330" width="130" height="150" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text x="505" y="356" class="b" text-anchor="middle" fill="#c2410c">MUX B</text>
  <text x="505" y="376" class="s" text-anchor="middle">TMUX136 x6</text>
  <text x="505" y="398" class="m" text-anchor="middle">SEL J18</text>
  <text x="505" y="418" class="m" text-anchor="middle">OE  J17</text>
  <text x="505" y="442" class="s" text-anchor="middle">ECAT1 ↔ ETH2</text>
  <text x="505" y="462" class="s" text-anchor="middle">핀 공유</text>

  <!-- MCU → MUX -->
  <line x1="370" y1="251" x2="440" y2="190" stroke="#db2777" stroke-width="1.2" stroke-dasharray="5 3"/>
  <line x1="370" y1="460" x2="440" y2="270" stroke="#0891b2" stroke-width="2.5"/>
  <line x1="370" y1="289" x2="440" y2="360" stroke="#db2777" stroke-width="1.2" stroke-dasharray="5 3"/>
  <line x1="370" y1="494" x2="440" y2="450" stroke="#0891b2" stroke-width="2.5"/>

  <!-- PHY -->
  <rect x="620" y="110" width="320" height="60" rx="6" fill="#ffffff" stroke="#db2777"/>
  <text x="636" y="134" class="b" fill="#9d174d">J56A · U21 YT8531SH</text>
  <text x="636" y="154" class="s">ETH0 · RGMII 1G · J12 1-2 일 때</text>

  <rect x="620" y="190" width="320" height="60" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2.5"/>
  <text x="636" y="214" class="b" fill="#0e7490">J57A · U22 RTL8201FI</text>
  <text x="636" y="234" class="s">ECAT0 · MII 100M · 기본</text>

  <rect x="620" y="310" width="320" height="60" rx="6" fill="#ffffff" stroke="#db2777"/>
  <text x="636" y="334" class="b" fill="#9d174d">J56B · U29 YT8531SH</text>
  <text x="636" y="354" class="s">ETH2 · RGMII 1G · J18 1-2 일 때</text>

  <rect x="620" y="390" width="320" height="60" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2.5"/>
  <text x="636" y="414" class="b" fill="#0e7490">J57B · U23 RTL8201FI</text>
  <text x="636" y="434" class="s">ECAT1 · MII 100M · 기본</text>

  <line x1="570" y1="190" x2="620" y2="140" stroke="#db2777" stroke-width="1.2" stroke-dasharray="5 3"/>
  <line x1="570" y1="240" x2="620" y2="220" stroke="#0891b2" stroke-width="2.5"/>
  <line x1="570" y1="370" x2="620" y2="340" stroke="#db2777" stroke-width="1.2" stroke-dasharray="5 3"/>
  <line x1="570" y1="420" x2="620" y2="420" stroke="#0891b2" stroke-width="2.5"/>

  <rect x="620" y="474" width="320" height="56" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="636" y="497" class="s">동시 사용 가능한 조합</text>
  <text x="636" y="517" class="m">ECAT0 + ETH2  /  ETH0 + ECAT1</text>
</svg>
