<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" width="960" height="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
  <style>
    .b   { font-size: 13px; font-weight: 600; }
    .s   { font-size: 11.5px; fill: #6b7280; }
    .m   { font-size: 11.5px; font-family: ui-monospace, Menlo, Consolas, monospace; fill: #4b5563; }
    .ttl { font-size: 15px; font-weight: 700; fill: #374151; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="800" fill="#fbfbfd"/>
  <text x="20" y="28" class="ttl">UART 다운로드 — download.py → 앱 → 부트로더</text>
  <text x="20" y="48" class="s">rt1180-boot/tools/download.py · 부트로더 ap/modules/cmd · 앱 cmd/process/cmd_boot.c · 같은 UART 에서 02 FD 패킷만 골라낸다</text>
  <rect x="40" y="66" width="220" height="34" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/>
  <text x="150" y="88" class="b" text-anchor="middle" fill="#374151">PC  download.py</text>
  <rect x="370" y="66" width="220" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
  <text x="480" y="88" class="b" text-anchor="middle" fill="#166534">앱 (XIP, 초록)</text>
  <rect x="690" y="66" width="220" height="34" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="800" y="88" class="b" text-anchor="middle" fill="#3730a3">부트로더 (Code TCM, 파랑)</text>
  <line x1="150" y1="100" x2="150" y2="740" stroke="#e5e7eb" stroke-dasharray="4 4"/>
  <line x1="480" y1="100" x2="480" y2="740" stroke="#e5e7eb" stroke-dasharray="4 4"/>
  <line x1="800" y1="100" x2="800" y2="740" stroke="#e5e7eb" stroke-dasharray="4 4"/>
  <line x1="156" y1="130" x2="474" y2="130" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="315.0" y="124" class="m" text-anchor="middle">INFO</text>
  <line x1="474" y1="144" x2="156" y2="144" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="315.0" y="160" class="s" text-anchor="middle">mode APP</text>
  <line x1="156" y1="192" x2="474" y2="192" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="315.0" y="186" class="m" text-anchor="middle">FW_UPDATE</text>
  <rect x="370" y="214" width="220" height="40" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <text x="480" y="230" class="b" text-anchor="middle" fill="#166534">resetToBoot()</text>
  <text x="480" y="246" class="s" text-anchor="middle">GPR MODE_BIT_BOOT → 리셋</text>
  <line x1="590" y1="234" x2="694" y2="234" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="642" y="228" class="s" text-anchor="middle">리셋</text>
  <line x1="156" y1="282" x2="794" y2="282" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="475.0" y="276" class="m" text-anchor="middle">INFO</text>
  <line x1="794" y1="296" x2="156" y2="296" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="475.0" y="312" class="s" text-anchor="middle">mode BOOT · cmd_ver 2</text>
  <line x1="156" y1="344" x2="794" y2="344" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="475.0" y="338" class="m" text-anchor="middle">BAUD 4000000</text>
  <line x1="794" y1="358" x2="156" y2="358" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="475.0" y="374" class="s" text-anchor="middle">응답 뒤 양쪽 4 Mbps. 3 초 동안 오가는 것이 없으면 보드는 115200 으로</text>
  <line x1="156" y1="406" x2="794" y2="406" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="475.0" y="400" class="m" text-anchor="middle">VERSION · FW_BEGIN</text>
  <line x1="794" y1="420" x2="156" y2="420" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="475.0" y="436" class="s" text-anchor="middle">BEGIN : TAG 섹터부터 지운다 (끊겨도 옛 앱을 실행하지 않는다)</text>
  <line x1="156" y1="468" x2="794" y2="468" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="475.0" y="462" class="m" text-anchor="middle">FW_ERASE</text>
  <line x1="794" y1="482" x2="156" y2="482" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="475.0" y="498" class="s" text-anchor="middle">64 KB 블록 — 지우는 동안에도 UART · SysTick 이 돈다</text>
  <line x1="156" y1="530" x2="794" y2="530" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="475.0" y="524" class="m" text-anchor="middle">FW_WRITE  [offset][1016 B]  × N</text>
  <line x1="794" y1="544" x2="156" y2="544" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="475.0" y="560" class="s" text-anchor="middle">160 KB/s</text>
  <line x1="156" y1="592" x2="794" y2="592" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="475.0" y="586" class="m" text-anchor="middle">FW_END</text>
  <line x1="794" y1="606" x2="156" y2="606" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="475.0" y="622" class="s" text-anchor="middle">[size][crc] — 부트로더가 CRC 를 내고 TAG 를 마지막에 쓴다 (커밋)</text>
  <line x1="156" y1="654" x2="794" y2="654" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="475.0" y="648" class="m" text-anchor="middle">FW_VERIFY · BAUD 115200 · FW_JUMP</text>
  <rect x="690" y="680" width="220" height="30" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="1.4"/>
  <text x="800" y="700" class="b" text-anchor="middle" fill="#3730a3">bootJumpFirm() → 앱</text>
  <line x1="694" y1="695" x2="590" y2="695" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="20" y="768" class="s">실측 (4 Mbps): 앱 75 KB 1.07 s · CM7 23 KB 0.41 s · DATA 300 KB 3.47 s · 쓰기 160 KB/s.  115200 은 앱 7.6 s (10.7 KB/s)</text>
  <text x="20" y="788" class="s">대상: fw(TAG + 앱) · cm7(CM7 슬롯, RMC7 확인) · data(+offset).  boot 는 받지 않는다 — 부트 슬롯이 하나라 probe-rs 로 쓴다</text>
</svg>
